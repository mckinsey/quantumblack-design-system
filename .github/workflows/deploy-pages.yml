# Production → gh-pages root. PR previews → gh-pages/pr-preview/pr-<n>/.
#
# Required (Settings → Pages): Source = Deploy from branch → gh-pages / (root)
# If PR deploy push fails with "Authentication failed", add repo secret GH_PAGES_DEPLOY_TOKEN
# (PAT with contents:write on this repo) — some orgs block GITHUB_TOKEN writes on pull_request.
name: Deploy QB Registry to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PAGES_BASE_URL: ${{ vars.QBDS_REGISTRY_URL || 'https://designsystem.quantumblack.com' }}
  GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_DEPLOY_TOKEN || github.token }}

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      QBDS_REGISTRY_URL: ${{ vars.QBDS_REGISTRY_URL || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ env.PAGES_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ env.GH_PAGES_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy production to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp CNAME /tmp/CNAME
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          saved=$(mktemp -d)
          [ -d pr-preview ] && cp -a pr-preview "$saved/"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          [ -d "$saved/pr-preview" ] && cp -a "$saved/pr-preview" .
          cp -a dist/. .
          cp /tmp/CNAME CNAME
          git add -A
          git diff --staged --quiet || git commit -m "Deploy production from ${GITHUB_SHA}"
          git push origin gh-pages

  build-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      QBDS_REGISTRY_URL: ''
      VITE_BASE_PATH: ${{ format('/pr-preview/pr-{0}/', github.event.pull_request.number) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: dist-preview
          path: dist

  deploy-preview:
    needs: build-preview
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ format('{0}/pr-preview/pr-{1}/', env.PAGES_BASE_URL, github.event.pull_request.number) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.VIZRO_SVC_PAT }}

      - uses: actions/download-artifact@v4
        with:
          name: dist-preview
          path: dist

      - name: Deploy preview to gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config --global user.email "145135826+vizro-svc@users.noreply.github.com"
          git config --global user.name "Vizro Team"
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          rm -rf pr-preview/pr-${PR_NUMBER}
          mkdir -p pr-preview/pr-${PR_NUMBER}
          cp -a dist/. pr-preview/pr-${PR_NUMBER}/
          git add -A
          git diff --staged --quiet || git commit -m "Deploy preview for PR ${PR_NUMBER}"
          git push origin gh-pages

      - uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ format('{0}/pr-preview/pr-{1}/', env.PAGES_BASE_URL, github.event.pull_request.number) }}
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const body = [marker, '## PR Preview', '', `**Preview URL:** ${process.env.PREVIEW_URL}`].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

  remove-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.VIZRO_SVC_PAT }}

      - name: Remove preview from gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config --global user.email "145135826+vizro-svc@users.noreply.github.com"
          git config --global user.name "Vizro Team"
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf pr-preview/pr-${PR_NUMBER}
          git add -A
          git diff --staged --quiet || git commit -m "Remove preview for PR ${PR_NUMBER}"
          git push origin gh-pages
