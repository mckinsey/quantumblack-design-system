# Deploys each PR to https://<site>/pr-preview/pr-<number>/ on the gh-pages branch.
# Requires GitHub Pages source: Deploy from branch → gh-pages (root). See deploy-pages.yml.
name: Registry PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      PREVIEW_SITE_URL: ${{ vars.QBDS_REGISTRY_URL || 'https://designsystem.quantumblack.com' }}
      PREVIEW_PATH: pr-preview/pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.cache.outputs.cache-hit != 'true' && github.event.action != 'closed'
        run: npm ci --prefer-offline --no-audit

      - name: Build registry site
        if: github.event.action != 'closed'
        env:
          VITE_BASE_PATH: /${{ env.PREVIEW_PATH }}/
          QBDS_REGISTRY_URL: ${{ env.PREVIEW_SITE_URL }}/${{ env.PREVIEW_PATH }}
        run: |
          export QBDS_REGISTRY_URL="${QBDS_REGISTRY_URL%/}"
          npm run build
          cp dist/index.html dist/404.html

      - name: Prepare dist directory for preview removal
        if: github.event.action == 'closed'
        run: mkdir -p dist

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: ${{ env.PREVIEW_SITE_URL }}
          wait-for-pages-deployment: true
          comment: true
          qr-code: false
