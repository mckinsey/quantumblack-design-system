# Deploys a GitHub Pages preview for each PR using the same Actions-based flow as
# deploy-pages.yml (preview: true). Preview link: Registry preview check → View deployment.
#
# Manual test (before merge): Actions → Registry preview → Run workflow → your branch.
name: Registry preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: registry-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Registry preview
    env:
      QBDS_REGISTRY_URL: ${{ vars.QBDS_REGISTRY_URL || 'https://designsystem.quantumblack.com' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Build registry site
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          QBDS_REGISTRY_URL: ${{ vars.QBDS_REGISTRY_URL || steps.pages.outputs.base_url }}
        run: |
          export QBDS_REGISTRY_URL="${QBDS_REGISTRY_URL%/}"
          npm run build
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Registry preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true

      - name: Add preview link to job summary
        if: steps.deployment.outputs.page_url != ''
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Registry preview"
            echo ""
            echo "[Open preview](${PREVIEW_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
